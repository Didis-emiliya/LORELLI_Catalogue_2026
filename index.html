<!DOCTYPE html>
<html lang="bg">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Digital Book Viewer</title>
    <meta name="description" content="Дигитален четец на книги">
    <link rel="icon" href="data:;base64,iVBORw0KGgo=">
    <link rel="stylesheet" href="style.css">
    <link rel="preload" href="https://unpkg.com/page-flip/dist/js/page-flip.browser.js" as="script">
</head>
<body>
    <header class="top-bar">
        <input type="number" id="pageInput" placeholder="Page" min="1">
        <button id="goBtn" aria-label="Отиди на страница">Go</button>
    </header>

    <main id="bookContainer" aria-live="polite"></main>

    <footer class="bottom-bar">
        <div id="thumbnailContainer"></div>
        <div id="pageCounter" role="status">Cover</div>
    </footer>

    <script src="https://unpkg.com/page-flip/dist/js/page-flip.browser.js" defer></script>
    <script src="script.js" defer></script>
</body>
</html>
